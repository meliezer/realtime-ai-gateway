version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:24.0

      - image: postgres:17
        environment:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app

      - image: redis:8

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Create .env file
          command: |
            cat <<EOF > .env
            PORT=3000
            REDIS_HOST=localhost
            REDIS_PORT=6379
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            POSTGRES_DB=app
            POSTGRES_USER=app
            POSTGRES_PASSWORD=app
            EOF

      - run:
          name: Run lint
          command: npm run lint

      - run:
          name: Run build
          command: npm run build

      - run:
          name: Run tests
          command: npm run test

workflows:
  secure-delivery:
    jobs:
      - build-and-test
