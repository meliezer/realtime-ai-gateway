version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:24.0

      - image: postgres:17
        environment:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app

      - image: redis:8

working_directory: ~/project

commands:
  restore-node-cache:
    steps:
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-

  save-node-cache:
    steps:
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

  setup-environment:
    steps:
      - run:
          name: Create .env file
          command: |
            cat <<EOF > .env
            PORT=3000
            REDIS_HOST=localhost
            REDIS_PORT=6379
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            POSTGRES_DB=app
            POSTGRES_USER=app
            POSTGRES_PASSWORD=app
            EOF

  install-dependencies:
    steps:
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  lint:
    executor: node-executor

    steps:
      - checkout
      - restore-node-cache
      - install-dependencies
      - save-node-cache

      - run:
          name: Run lint
          command: npm run lint

  build:
    executor: node-executor

    steps:
      - checkout
      - restore-node-cache
      - install-dependencies
      - save-node-cache

      - run:
          name: Run build
          command: npm run build

      - store_artifacts:
          path: dist
          destination: build-output

  integration-tests:
    executor: node-executor

    steps:
      - checkout
      - restore-node-cache
      - install-dependencies
      - save-node-cache
      - setup-environment

      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 1m

      - run:
          name: Wait for Redis
          command: dockerize -wait tcp://localhost:6379 -timeout 1m

      - run:
          name: Run tests
          command: npm run test

workflows:
  continuous-verification:
    jobs:
      - lint

      - build:
          requires:
            - lint

      - integration-tests:
          requires:
            - build
